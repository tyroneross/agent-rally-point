#
# Example global manifest for agent-rally-point.
# Auto-generated on first `agent-rally-discover` invocation at
# ~/.agent-rally-point/manifest.toml; this file is a checked-in reference
# of the expected shape and field set.

schema_version = "1.0"
protocol_version = "1.0"

[package]
name = "agent-rally-point"
version = "0.3.0"
installed_at = "2026-05-24T12:00:00Z"

[paths]
# Per-repo canonical store lives at `<repo_root>/.rally/` (ledger.jsonl
# canonical + facts.db derived cache). This is the source of truth and
# survives clone with no external service. The home-dir paths below are
# global *discovery hints* — pointers that let `rally locate` / `rally
# recent --all` find rooms across the user's repos. They never hold
# canonical data.

# Global discovery hint: pointers-only index at
# ~/.agent-rally-point/rooms/v1/index.json (see docs/RALLY_ARCHITECTURE.md
# for the per-repo segmentation contract).
apps_root = "~/.agent-rally-point/apps"

# Legacy hint root scanned only when `rally locate --include-legacy` /
# `rally recent --include-legacy` is set. Retained for one cutover cycle;
# it is *not* a write path under any current policy.
legacy_apps_root = "~/.agent-rally-point/apps"

[policy]
# Coordination substrate policy. Values:
#   canonical    — write only to <repo_root>/.rally/ (no global writes)
#   migration    — DUAL-AWARE: write to <repo_root>/.rally/ and keep a
#                  discovery-hint entry in ~/.agent-rally-point/rooms/v1/.
#   legacy-only  — read-only fallback that scans the legacy hint root
#                  during `--include-legacy` discovery only.
# Default: migration. Per-repo `.rally/ledger.jsonl` is canonical under
# every policy; the modes differ only in which discovery hints are
# written.
mode = "migration"

[api]
# Shipped surface: the `rally` binary (crates/rally-cli) is the only runtime entry.
cli_entry = "rally"
schema_doc = "https://github.com/tyroneross/agent-rally-point/blob/main/docs/SCHEMA.md"

# Aspirational — not yet implemented. A Python discovery module
# (`agent_rally_point.discover`) is roadmapped for host-side channel resolution;
# no runtime reads this field today. Tracked for a future release.
# discover_module = "agent_rally_point.discover"

[defaults]
# Presence heartbeat staleness window (minutes). Reaped at checkpoint_read.
heartbeat_minutes = 15

# Defense-in-depth reaper threshold at run closeout (seconds).
stale_session_seconds = 3600
