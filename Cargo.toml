[workspace]
members = [
    "crates/rally-cli",
    "crates/rally-protocol",
    "crates/rally-router-core",
    "crates/rallyd",
    "crates/cockpitd",
    "crates/cockpit-cli",
    "crates/rally-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/tyroneross/agent-rally-point"

[workspace.dependencies]
bpaf = "0.9.26"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
factstr = "0.5.2"
factstr-sqlite = "0.5.2"
schemars = { version = "1", features = ["uuid1", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
thiserror = "2"
# cockpit daemon stack
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "net", "sync", "time", "fs"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# F4/F5 crypto
dryoc = "0.8"
rand = "0.8"

[patch.crates-io]
# factstr-sqlite 0.5.2 drops its sqlx pool asynchronously. The vendored delta
# closes synchronously so SQLite's final WAL checkpoint/unlink completes before
# Rally releases its cross-process mutation lock. See vendor/.../UPSTREAM.md.
factstr-sqlite = { path = "vendor/factstr-sqlite" }

# Release profile — tuned for the shipped binaries (arm64 macOS is the primary
# target). Defaults leave codegen-units=16 and no LTO, so the release binary is
# under-optimized. `rally` runs on every commit (before-write/before-complete
# hooks), so smaller + faster startup is directly user-visible.
[profile.release]
lto = true          # fat cross-crate LTO: inlining across crates, smaller code
codegen-units = 1   # one unit → maximal optimization (no parallel-split inlining loss)
strip = true        # drop symbols from the shipped binary
# opt-level stays 3 (release default); panic stays unwind (abort would change
# runtime behavior and break unwind-dependent tests).
