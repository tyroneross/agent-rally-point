[workspace]
members = [
    "crates/rally-cli",
    "crates/cockpitd",
    "crates/cockpit-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
bpaf = "0.9.26"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
factstr = "0.5.2"
factstr-sqlite = "0.5.2"
schemars = { version = "1", features = ["uuid1", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
thiserror = "2"
# cockpit daemon stack
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "net", "sync", "time", "fs"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
