[workspace]
members = [
    "crates/rally-cli",
    "crates/rally-protocol",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
bpaf = "0.9.26"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
factstr = "0.5.2"
factstr-sqlite = "0.5.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
thiserror = "2"
