[workspace]
members = [
    "crates/rally-cli",
    "crates/rally-protocol",
    "crates/rally-trust",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
