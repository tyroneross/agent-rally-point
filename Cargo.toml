[workspace]
members = [
    "crates/rally-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
factstr = "0.5.2"
factstr-sqlite = "0.5.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
shlex = "1.3"
