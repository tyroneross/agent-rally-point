[workspace]
members = [
    "crates/rally-cli",
    "crates/rally-core",
    "crates/rally-protocol",
    "crates/rally-trust",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
