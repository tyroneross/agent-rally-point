#
# Release workflow: builds the rally CLI for all 4 supported target triples
# on every version tag (v*) and uploads the binaries as GitHub Release assets.
# Triggered by: push to tags matching v* OR workflow_dispatch.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon) — macos-14 runner is arm64 native
          - triple: aarch64-apple-darwin
            runner: macos-14
            target: aarch64-apple-darwin
            cross: false

          # macOS x86_64 (Intel) — macos-13 is the last Intel macOS runner
          - triple: x86_64-apple-darwin
            runner: macos-13
            target: x86_64-apple-darwin
            cross: false

          # Linux x86_64 — native build on ubuntu-latest
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false

          # Linux aarch64 — cross-compiled on x86_64 ubuntu via the
          # `cross` crate (wraps Docker + pre-built cross images). This is
          # the simplest reliable approach that avoids custom QEMU setup:
          # `cross build` is a drop-in replacement for `cargo build` and
          # handles the sysroot and linker transparently.
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p rally-cli --target ${{ matrix.target }}

      - name: Build (cross — aarch64-linux)
        if: ${{ matrix.cross }}
        run: cross build --release -p rally-cli --target ${{ matrix.target }}

      - name: Rename binary to rally-<triple>
        run: |
          cp target/${{ matrix.target }}/release/rally rally-${{ matrix.triple }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rally-${{ matrix.triple }}
