#
# Release workflow: builds the rally CLI for all 4 supported target triples on
# every version tag (v*), publishes each binary + a SHA256 sidecar, and signs a
# build-provenance attestation.
#
# Both artifacts are now verified CLIENT-SIDE, before the downloaded file is
# made executable, by scripts/install-rally.sh (ARP-001). The SHA256 covers
# integrity; the attestation is the anti-tamper layer against release-asset
# substitution, because the checksum lives on the same release as the binary
# and cannot catch a compromised release on its own.
#
# The installer is fail-closed: a missing `gh`, a missing checksum, or a failed
# attestation stops the download path rather than degrading to an unverified
# install. This used to be out-of-band-only verification performed by a human,
# which was the gap ARP-001 named.
#
# Manual check, still useful for auditing a published release:
#   gh attestation verify rally-<triple> --repo tyroneross/agent-rally-point

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + attach assets to (e.g. v0.1.2). Required for manual runs."
        required: true

permissions:
  contents: write       # upload release assets
  id-token: write       # provenance attestation (sigstore OIDC)
  attestations: write   # write the attestation

jobs:
  # Gates the whole build matrix on release-version parity: the canonical CLI
  # version (crates/rally-cli/Cargo.toml) must agree with every plugin
  # manifest AND the bundled Codex artifact must not be stale. A
  # version-drifted or stale-artifact state must never reach a published
  # release — fail fast here, before spending the 4-triple build matrix.
  parity:
    name: Release parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Release parity (scripts/check-release-parity.sh)
        run: ./scripts/check-release-parity.sh

  build:
    name: Build ${{ matrix.triple }}
    needs: parity
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon) — macos-14 runner is arm64 native
          - triple: aarch64-apple-darwin
            runner: macos-14
            target: aarch64-apple-darwin
            cross: false

          # macOS x86_64 (Intel) — cross-compiled on the arm64 macos-14 runner.
          # GitHub is retiring the native Intel `macos-13` runner; it starves in
          # the queue (a v0.1.4 run waited ~5h and never got one). Rust + the
          # universal Xcode toolchain on Apple Silicon emit a valid x86_64 Mach-O
          # via `cargo build --target x86_64-apple-darwin`, so no Intel runner is
          # needed. `cross: false` — this is a native Rust cross-target, not the
          # `cross` crate (which is Linux-container based).
          - triple: x86_64-apple-darwin
            runner: macos-14
            target: x86_64-apple-darwin
            cross: false

          # Linux x86_64 — native build on ubuntu-latest
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false

          # Linux aarch64 — cross-compiled on x86_64 ubuntu via the `cross`
          # crate (wraps Docker + pre-built cross images): a drop-in for
          # `cargo build` that handles the sysroot/linker with no QEMU setup.
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the SOURCE of the named tag (manual dispatch) so a re-published
          # release matches its tag, not whatever main HEAD happens to be. The
          # workflow DEFINITION still comes from the dispatch ref (main), so CI
          # fixes like the macos-14 Intel cross-compile apply to old tags too.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Belt-and-suspenders: the toolchain action's `targets:` did not reliably
      # install the non-native std on the macos-14 (arm64) image, so the Intel
      # cross-target build failed with E0463 "can't find crate for core". Add the
      # target explicitly with the same rustup that `cargo build` uses. No-op when
      # the target is already present (native builds).
      - name: Ensure target std is installed
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p rally-cli --target ${{ matrix.target }}

      - name: Build (cross — aarch64-linux)
        if: ${{ matrix.cross }}
        run: cross build --release -p rally-cli --target ${{ matrix.target }}

      - name: Stage binary + SHA256 sidecar
        run: |
          cp target/${{ matrix.target }}/release/rally rally-${{ matrix.triple }}
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 rally-${{ matrix.triple }} > rally-${{ matrix.triple }}.sha256
          else
            sha256sum rally-${{ matrix.triple }} > rally-${{ matrix.triple }}.sha256
          fi
          cat rally-${{ matrix.triple }}.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: rally-${{ matrix.triple }}

      - name: Upload to GitHub Release
        # Only attach assets for an actual tag (push-tag, or a workflow_dispatch
        # that names an existing tag). Prevents the upload step from erroring on
        # a tagless manual run after four full builds.
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            rally-${{ matrix.triple }}
            rally-${{ matrix.triple }}.sha256
