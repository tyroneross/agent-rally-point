#
# Release workflow: builds the rally CLI for all 4 supported target triples on
# every version tag (v*), publishes each binary + a SHA256 sidecar, and signs a
# build-provenance attestation.
#
# Both artifacts are now verified CLIENT-SIDE, before the downloaded file is
# made executable, by scripts/install-rally.sh (ARP-001). The SHA256 covers
# integrity; the attestation is the anti-tamper layer against release-asset
# substitution, because the checksum lives on the same release as the binary
# and cannot catch a compromised release on its own.
#
# The installer is fail-closed: a missing `gh`, a missing checksum, or a failed
# attestation stops the download path rather than degrading to an unverified
# install. This used to be out-of-band-only verification performed by a human,
# which was the gap ARP-001 named.
#
# Manual check, still useful for auditing a published release:
#   gh attestation verify rally-<triple> --repo tyroneross/agent-rally-point

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to stage and publish (e.g. v0.2.5). Published releases cannot be overwritten."
        required: true

permissions:
  actions: read        # download the complete build matrix before publication
  contents: write       # upload release assets
  id-token: write       # provenance attestation (sigstore OIDC)
  attestations: write   # write the attestation

# Serialize retries for a tag. A failed run can safely resume its draft, but a
# separate run must never publish or mutate the same release concurrently.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A tag push does not run the branch-only CI workflow. Re-run the same
  # pinned acceptance gate here so a parity-clean but unformatted, unlinted,
  # or failing tag cannot publish release assets.
  quality:
    name: Release quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Keep this exact pin in lockstep with rust-toolchain.toml, CI, and
      # scripts/run-quality-gate.sh. A moving stable toolchain makes the
      # release quality verdict different from the one contributors see.
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Install cargo-audit + cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: Quality gate (scripts/run-quality-gate.sh)
        run: ./scripts/run-quality-gate.sh

  # Gates the whole build matrix on release-version parity: the canonical CLI
  # version (crates/rally-cli/Cargo.toml) must agree with every plugin
  # manifest AND the bundled Codex artifact must not be stale. A
  # version-drifted or stale-artifact state must never reach a published
  # release — fail fast here, before spending the 4-triple build matrix.
  parity:
    name: Release parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Release parity (scripts/check-release-parity.sh)
        env:
          # The tag must be both the release name and the exact version encoded
          # in the checked-out CLI/package surfaces. This also rejects a manual
          # dispatch that names a missing tag or checks out a different commit.
          RALLY_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./scripts/check-release-parity.sh

  build:
    name: Build ${{ matrix.triple }}
    needs: [quality, parity]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon) — macos-14 runner is arm64 native
          - triple: aarch64-apple-darwin
            runner: macos-14
            target: aarch64-apple-darwin
            cross: false

          # macOS x86_64 (Intel) — cross-compiled on the arm64 macos-14 runner.
          # GitHub is retiring the native Intel `macos-13` runner; it starves in
          # the queue (a v0.1.4 run waited ~5h and never got one). Rust + the
          # universal Xcode toolchain on Apple Silicon emit a valid x86_64 Mach-O
          # via `cargo build --target x86_64-apple-darwin`, so no Intel runner is
          # needed. `cross: false` — this is a native Rust cross-target, not the
          # `cross` crate (which is Linux-container based).
          - triple: x86_64-apple-darwin
            runner: macos-14
            target: x86_64-apple-darwin
            cross: false

          # Linux x86_64 — native build on ubuntu-latest
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false

          # Linux aarch64 — cross-compiled on x86_64 ubuntu via the `cross`
          # crate (wraps Docker + pre-built cross images): a drop-in for
          # `cargo build` that handles the sysroot/linker with no QEMU setup.
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the SOURCE of the named tag (manual dispatch) so a re-published
          # release matches its tag, not whatever main HEAD happens to be. The
          # workflow DEFINITION still comes from the dispatch ref (main), so CI
          # fixes like the macos-14 Intel cross-compile apply to old tags too.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      # Belt-and-suspenders: the toolchain action's `targets:` did not reliably
      # install the non-native std on the macos-14 (arm64) image, so the Intel
      # cross-target build failed with E0463 "can't find crate for core". Add the
      # target explicitly with the same rustup that `cargo build` uses. No-op when
      # the target is already present (native builds).
      - name: Ensure target std is installed
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p rally-cli --target ${{ matrix.target }}

      - name: Build (cross — aarch64-linux)
        if: ${{ matrix.cross }}
        run: cross build --release -p rally-cli --target ${{ matrix.target }}

      - name: Stage binary + SHA256 sidecar
        run: |
          cp target/${{ matrix.target }}/release/rally rally-${{ matrix.triple }}
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 rally-${{ matrix.triple }} > rally-${{ matrix.triple }}.sha256
          else
            sha256sum rally-${{ matrix.triple }} > rally-${{ matrix.triple }}.sha256
          fi
          cat rally-${{ matrix.triple }}.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: rally-${{ matrix.triple }}

      # Matrix jobs must never publish directly: another platform can still
      # fail after this one succeeds. Store the complete platform pair for a
      # single publisher job that runs only after the whole matrix is green.
      - name: Upload release assets for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            rally-${{ matrix.triple }}
            rally-${{ matrix.triple }}.sha256

  publish:
    name: Publish complete release
    needs: [quality, parity, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download complete build matrix
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Verify every target produced its binary and SHA256 sidecar
        run: |
          set -euo pipefail
          for triple in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu; do
            for suffix in "" .sha256; do
              asset="release-assets/rally-${triple}${suffix}"
              if [ ! -f "$asset" ]; then
                echo "missing required release asset: $asset" >&2
                exit 1
              fi
            done
          done
          find release-assets -maxdepth 1 -type f -print | sort

      # A failed upload may leave some assets on GitHub. Keep that incomplete
      # state invisible in a draft; only the final API call makes it public.
      # A retry may resume a draft, but must never overwrite a public release.
      - name: Require a fresh or draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if draft="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .draft 2>&1)"; then
            if [ "$draft" != "true" ]; then
              echo "refusing to mutate published release $TAG" >&2
              exit 1
            fi
            echo "resuming draft release $TAG"
          elif printf '%s\n' "$draft" | grep -q 'HTTP 404'; then
            echo "creating draft release $TAG"
          else
            printf '%s\n' "$draft" >&2
            echo "could not determine release state for $TAG; refusing publication" >&2
            exit 1
          fi

      - name: Stage all release assets in a draft
        id: upload_draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Publish the complete staged release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload_draft.outputs.id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=true \
            --silent
