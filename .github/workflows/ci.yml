#
# CI: validates source quality, current release parity, packaged workflows, and
# a representative 2/4/6-agent local-repo workload. Maintainer-only pre-push
# contracts and supply-chain publication checks remain in the release workflow.
#
# For the pull_request trigger we check out the PR HEAD SHA EXPLICITLY
# (github.event.pull_request.head.sha) rather than relying on the default
# pull_request ref, and then assert `git rev-parse HEAD` equals that SHA.
# GitHub's default pull_request checkout resolves to a synthetic merge-ref
# commit, which is NOT the PR head — a gate that silently validates that
# merge ref instead of the actual reviewed commit is validating the wrong
# tree. Failing loudly here closes that gap rather than trusting it silently.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'bl/**'

# SEC-005: default GITHUB_TOKEN permissions are broad (write) unless a repo-
# or org-level default narrows them; scope explicitly rather than inherit.
# This workflow only checks out code and runs local scripts — it needs
# nothing beyond read access. (release.yml already scopes its own
# permissions per-job for the elevated actions it actually performs.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR head SHA, explicit)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v7

      - name: Assert checked-out HEAD matches the PR head SHA
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::CI checked out $actual but the PR head SHA is $expected — refusing to validate the wrong commit." >&2
            exit 1
          fi
          echo "CI validating PR head SHA $actual (confirmed)"

      # Pin the EXACT stable (not moving `@stable`) so local (rust-toolchain.toml)
      # and CI rustfmt/clippy agree — a moving toolchain drifts rustfmt output and
      # makes the fmt gate flaky. Keep this pin in lockstep with rust-toolchain.toml
      # and scripts/run-quality-gate.sh's RALLY_QG_TOOLCHAIN default.
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Quality gate (scripts/run-quality-gate.sh — same gate as local pre-push)
        run: ./scripts/run-quality-gate.sh

      - name: Release parity (scripts/check-release-parity.sh)
        run: ./scripts/check-release-parity.sh

      - name: CI and release workflow contract
        run: python3 tests/scripts/test_release_workflow_contract.py

      # Advisory: the lint exits 0 whatever it finds, so this step cannot fail
      # the build. `--strict` stays off until precision is measured
      # out-of-sample. Its own tests run here too, because a detector whose
      # tests nothing executes cannot catch a regression in itself.
      - name: Sibling-asymmetry lint (advisory, WARN-only)
        run: |
          python3 tests/scripts/test_lint_sibling_asymmetry.py
          python3 scripts/lint_sibling_asymmetry.py

      - name: Install Node.js (pinned)
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'

      # Build the exact release binary, run packaged workflow acceptance, then
      # model individuals/small teams coordinating 2, 4, and 6 local agents.
      - name: Product acceptance gate
        run: ./scripts/run-release-auxiliary-gate.sh --product-only

      - name: Workflow syntax (Actionlint 1.7.12)
        uses: docker://rhysd/actionlint:1.7.12
