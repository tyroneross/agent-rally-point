name: Rally coordination gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rally-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Rally coordination gate
        run: cargo run -p rally2-cli -- check before-complete --tool ci --json
