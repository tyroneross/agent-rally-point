name: Rally coordination gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rally-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the EXACT stable (not moving `@stable`) so local and CI rustfmt agree
      # — a moving toolchain drifts rustfmt versions and makes the fmt gate flaky.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Format check
        run: cargo fmt --all --check
      # Enforcement gate: findings were fixed in 9c2878c but left ungated —
      # without this step clippy can silently drift back. Pinned toolchain +
      # clippy component (above) keep local and CI verdicts in lockstep.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release binary (arms the empirical packet gate)
        run: cargo build --release -p rally-cli
      - name: dynamic-workflows node tests (empirical gate ARMED)
        working-directory: dynamic-workflows
        run: node --test "tests/**/*.test.mjs"
      # Supply-chain gates. Configs (.cargo/audit.toml, deny.toml) were added
      # in the hygiene bundle but never wired into CI; prebuilt binaries via
      # install-action keep this fast and hermetic.
      - name: Install cargo-audit + cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Cargo audit (advisories)
        run: cargo audit
      - name: Cargo deny (advisories/bans/licenses/sources)
        run: cargo deny check --hide-inclusion-graph
      - name: Rally coordination gate
        run: cargo run -p rally-cli -- check before-complete --tool ci --json
