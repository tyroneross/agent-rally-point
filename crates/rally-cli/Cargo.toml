[package]
name = "rally-cli"
version = "0.2.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Repo-local coordination CLI for multi-agent Rally Point rooms."
repository.workspace = true
publish = false

[[bin]]
name = "rally"
path = "src/main.rs"

[dependencies]
bpaf.workspace = true
chrono.workspace = true
factstr.workspace = true
factstr-sqlite.workspace = true
# kqueue (macOS/BSD)/inotify (Linux) FFI backing `log_watch` — event-driven
# `rally watch`. `libc 0.2.186` is already in Cargo.lock as a transitive dep
# (via rusqlite et al.), so this adds ZERO new crates to the build graph.
# Deliberately NOT the `notify` crate — it pulls a large dependency tree,
# which conflicts with this crate's minimal-dependency discipline (see the
# H4 architectural lint in `tests/arch_no_herdr_dep.rs`).
libc.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
shlex.workspace = true
thiserror.workspace = true
uuid.workspace = true

# Plan F: the shared rally <-> daemon coupling surface. rally-cli writes
# typed Directives; rally-termd subscribes and posts Receipts. ZERO further
# dependencies (the H4 architectural lint asserts rally-cli does not depend
# on `ptyd` either directly or transitively).
rally-protocol = { version = "0.1.0", path = "../rally-protocol" }
rusqlite.workspace = true

[dev-dependencies]
