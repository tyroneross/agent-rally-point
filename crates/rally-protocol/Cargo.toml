[package]
name = "rally-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The shared rally <-> daemon coupling surface (Plan F): typed Directive/Receipt + Inbox trait + ledger reader. Used by rally-cli (writer) and rally-termd (consumer). Zero deps beyond serde."
keywords = ["coordination", "multi-agent", "event-sourcing", "ledger"]
categories = ["data-structures", "asynchronous"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# round-trip + property-style tests stay std-only
